<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Kirish — Akir Media</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d0d1a;color:#e8e8ff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#13132a;border:1px solid rgba(108,99,255,.2);border-radius:24px;padding:48px 40px;width:100%;max-width:400px;margin:20px}
.logo{text-align:center;font-size:1.6rem;font-weight:800;background:linear-gradient(135deg,#6c63ff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.subtitle{text-align:center;color:#9090b0;font-size:.9rem;margin-bottom:36px}
label{display:block;font-size:.85rem;color:#9090b0;margin-bottom:8px;font-weight:500}
input[type=password]{width:100%;padding:14px 18px;background:#1a1a35;border:1px solid rgba(108,99,255,.2);border-radius:12px;color:#e8e8ff;font-size:1rem;outline:none;transition:.3s}
input[type=password]:focus{border-color:#6c63ff;background:rgba(108,99,255,.05)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#6c63ff,#a78bfa);border:none;border-radius:12px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;margin-top:20px;transition:.3s}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.error{background:rgba(255,101,132,.1);border:1px solid rgba(255,101,132,.3);color:#ff6584;padding:12px 16px;border-radius:10px;font-size:.88rem;margin-top:16px;display:none}
.back{text-align:center;margin-top:24px;font-size:.88rem;color:#9090b0}
.back a{color:#a78bfa}
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚡ Akir Media</div>
  <div class="subtitle">Admin panel — kirish</div>
  <form id="form">
    <label>Parol</label>
    <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password" autofocus>
    <button type="submit" class="btn" id="btn">Kirish</button>
    <div class="error" id="err">Parol noto'g'ri. Qayta urining.</div>
  </form>
  <div class="back"><a href="/">← Asosiy sahifaga qaytish</a></div>
</div>
<script>
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const pass = document.getElementById('pass').value;
  btn.disabled = true; btn.textContent = 'Kirilmoqda...'; err.style.display = 'none';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass }),
    });
    if (r.ok) { window.location.href = '/admin'; }
    else { err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Kirish'; }
  } catch { err.textContent = 'Server bilan bog\'lanib bo\'lmadi.'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Kirish'; }
});
</script>
</body>
</html>
